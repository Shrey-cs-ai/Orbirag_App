name: orbirag
description: "AI-Powered Research Assistant"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  google_sign_in: ^6.2.1

  # Storage
  shared_preferences: ^2.3.2

  # Speech & Audio
  speech_to_text: ^7.0.0
  record: ^5.1.2
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  loading_animation_widget: ^1.2.1

  # File Handling
  file_picker: ^8.1.2
  image_picker: ^1.1.2

  # Environment Variables
  flutter_dotenv: ^5.1.0

  # Networking
  http: ^1.2.2

  # UI Enhancements
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - .env